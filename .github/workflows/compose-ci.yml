name: Flask redis application CI
on:
    push:
        branches:
            - main

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout the code
              uses: actions/checkout@v4

            - name: Run the app
              run: |
                  docker compose up -d --build
            - name: Check the container
              run: |
                    docker compose ps
            - name: Show the logs
              run: |
                    docker compose logs
            - name: Wait for the application
              run: |
                    sleep 10
            - name: Check the Flask application
              run: |
                    curl -f http://localhost:5000/health
            - name: Check the Redis integration
              run: |
                    curl -f http://localhost:5000/count
            - name: Down the application  
              if: always()          
              run: |
                    docker compose down
    push:
        runs-on: ubuntu-latest

        needs: test

        steps:
            - name: Checkout the code
              uses: actions/checkout@v4

            - name: Build the image
              run: |
                    docker compose build flask

            - name: Docker login
              uses: docker/login-action@v2
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}

            - name: tag the image
              run: |    
                docker tag flask-redis-app ${{ secrets.DOCKER_USERNAME }}/flask-redis-app:latest

            - name: push image to Hub
              run: |
                docker push ${{ secrets.DOCKER_USERNAME }}/flask-redis-app:latest     

    pull:
        name: Pull image to EC2
        runs-on: ubuntu-latest
        needs: push

        steps:

            - name: Copying Docker compose file to ec2
              uses: appleboy/scp-action@v1.0.0
              with: 
                host: ${{ secrets.EC2_HOST }}
                username: ${{ secrets.EC2_USERNAME }}
                key: ${{ secrets.EC2_PASSWORD }}
                source: "docker-compose.yml"
                target: "/opt/docker-compose.yml" 
              
            - name: Pull image and Deploy application to EC2
              uses: appleboy/ssh-action@v1.2.5
              with:
                host: ${{ secrets.EC2_HOST }}
                username: ${{ secrets.EC2_USERNAME }}
                key: ${{ secrets.EC2_PASSWORD }}

                script: |
                    cd /opt/flask-compose-demo
                    docker compose version
                    echo "Logging into Docker Hub"
                    echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin                    
                    docker compose pull 
                    docker images
                    echo "Running the Application"
                    docker compose up -d 
                    echo "Waiting for the application to start"
                    sleep 10
                    echo "Checking the application"
                    curl -f http://localhost:5000/health
                    curl -f http://localhost:5000/count
                    echo "Checking the logs"
                    docker compose logs
                    echo "Checking containers"
                    docker compose ps
     


