name: Flask redis application CI
on:
    push:
        branches:
            - main

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout the code
              uses: actions/checkout@v4

            - name: Run the app
              run: |
                  docker compose up -d --build
            - name: Check the container
              run: |
                    docker compose ps
            - name: Show the logs
              run: |
                    docker compose logs
            - name: Wait for the application
              run: |
                    sleep 10
            - name: Check the Flask application
              run: |
                    curl -f http://localhost:5000/health
            - name: Check the Redis integration
              run: |
                    curl -f http://localhost:5000/count
            - name: Down the application  
              if: always()          
              run: |
                    docker compose down
    push:
        runs-on: ubuntu-latest

        needs: test

        steps:
            - name: Checkout the code
              uses: actions/checkout@v4

            - name: Build the image
              run: |
                    docker compose build flask

            - name: Docker login
              uses: docker/login-action@v2
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}

            - name: tag the image
              run: |    
                docker tag flask-redis-app ${{ secrets.DOCKER_USERNAME }}/flask-redis-app:latest

            - name: push image to Hub
              run: |
                docker push ${{ secrets.DOCKER_USERNAME }}/flask-redis-app:latest     

    pull:
        name: Pull image to EC2
        runs-on: ubuntu-latest
        needs: push

        steps:
            - name: Pull image to EC2
              uses: appleboy/ssh-action@v1.2.5  
              with:
                host: ${{ secrets.EC2_HOST }}
                username: ${{ secrets.EC2_USERNAME }}
                password: ${{ secrets.EC2_PASSWORD }}

         script: |
                echo "Logging into Docker Hub"
                echo "${{ secrets.EC2_PASSWORD }}" | docker login -u ${{ EC2_USERNAME }} --password-stdin
                docker compose version
                docker pull ${{ secrets.DOCKER_USERNAME }}/flask-redis-app:latest
                docker images


